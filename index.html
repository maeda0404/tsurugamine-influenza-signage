<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横浜市 感染症流行状況</title><link rel="stylesheet" href="css/style.css?v=7"><link rel="stylesheet" href="css/level-overrides.css?v=7"><style>
.disease-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:18px}.disease-card{padding:16px;border:4px solid #7894a8;border-radius:24px;background:#fff;text-align:center}.disease-name{margin:0 0 6px;font-size:clamp(25px,4vh,54px)}.level-badge{display:inline-block;margin:0 0 6px;padding:.18em .75em;border-radius:999px;font-size:clamp(20px,3vh,42px);font-weight:900;background:#e7eef3}.disease-value{display:flex;justify-content:center;align-items:baseline}.disease-value strong{font-size:clamp(54px,11vh,140px);line-height:1;font-weight:900}.disease-caption,.disease-meta{font-weight:800}.disease-card.level-warning{border-color:#d71920;background:#fff1f1}.disease-card.level-warning .level-badge{background:#d71920;color:#fff}.disease-card.level-advisory{border-color:#f59e0b;background:#fff8e7}.disease-card.level-advisory .level-badge{background:#f59e0b;color:#192b3a}.disease-card.level-epidemic{border-color:#e8c547;background:#fffceb}.disease-card.level-epidemic .level-badge{background:#ffe16a;color:#192b3a}.disease-card.level-normal{border-color:#5c9f72;background:#f2fbf5}.disease-card.level-normal .level-badge{background:#5c9f72;color:#fff}.disease-card.covid{border-color:#3978b8;background:#f5faff}.disease-card.covid.level-increase .level-badge{background:#f6c453;color:#192b3a}.disease-card.covid.level-decrease .level-badge{background:#65a8df;color:#fff}.disease-card.covid.level-same .level-badge,.disease-card.covid.level-neutral .level-badge{background:#dceaf6;color:#183047}@media(max-width:760px){.disease-grid{grid-template-columns:1fr}}
</style><script src="js/app.js?v=7" defer></script></head><body><div class="screen"><header class="header"><div id="area" class="prefecture">横浜市</div><h1 class="title">感染症流行状況</h1></header><main class="content"><section class="status" aria-live="polite"><div class="disease-grid"><article id="influenzaCard" class="disease-card influenza"><h2 class="disease-name">インフルエンザ</h2><div id="influenzaLevel" class="level-badge">確認中</div><div class="disease-value"><strong id="influenzaValue">--</strong><span class="unit">人</span></div><div class="disease-caption">定点当たり報告数</div><div id="influenzaTrend" class="disease-meta">前週比較 --</div><div id="influenzaWeek" class="disease-meta">--</div><div id="influenzaPublished">--</div><a id="influenzaSource" href="#" target="_blank" rel="noopener noreferrer" hidden>公式CSV</a></article><article id="covid19Card" class="disease-card covid"><h2 class="disease-name">新型コロナ</h2><div id="covid19Level" class="level-badge">確認中</div><div class="disease-value"><strong id="covid19Value">--</strong><span class="unit">人</span></div><div class="disease-caption">定点当たり報告数</div><div id="covid19Trend" class="disease-meta">前週比較 --</div><div id="covid19Week" class="disease-meta">--</div><div id="covid19Published">--</div><a id="covid19Source" href="#" target="_blank" rel="noopener noreferrer" hidden>公式CSV</a></article></div><div class="data-state">単位：<span id="unit">定点当たり報告数</span>｜<span id="dataStatus">確認中</span></div><div>出典：神奈川県衛生研究所（週別CSV）</div></section><section class="measures"><img class="measure-image" src="assets/handwash.png?v=7" alt="手洗い"><img class="measure-image" src="assets/healthcheck.png?v=7" alt="体調報告"><img class="measure-image" src="assets/ventilation.png?v=7" alt="換気"><img class="measure-image" src="assets/mask.png?v=7" alt="正しいマスク着用"></section></main><footer>体調に変化がある場合は、無理をせず報告してください</footer></div></body></html>
