<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相鉄鶴ヶ峰JV インフルエンザ情報</title>

    ./css/style.css
</head>

<body>

<div class="container">

    <header>
        <div class="site-name">
            相鉄鶴ヶ峰JV
        </div>
    </header>

    <main>

        <section class="flu-section">

            <div class="flu-title">
                神奈川県インフルエンザ流行状況
            </div>

            <div class="alert-level">
                警報発令中
            </div>

            <div class="flu-value">
                23.4
            </div>

            <div class="flu-unit">
                定点当たり報告数
            </div>

        </section>

        <section class="measure-section">

            <h2>
                感染対策3つの基本
            </h2>

            <div class="measure-grid">

                <div class="measure">
                    ./assets/handwash.png
                    <span>手洗い</span>
                </div>

                <div class="measure">
                    ./assets/healthcheck.png
                    <span>体調報告</span>
                </div>

                <div class="measure">
                    ./assets/ventilation.png
                    <span>換気</span>
                </div>

            </div>

        </section>

    </main>

    <footer>
        発熱・咳・のどの痛みがある場合は職長へ報告してください
    </footer>

</div>

./js/app.jsscript>

</body>
</html>
