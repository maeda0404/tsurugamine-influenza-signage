<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横浜市 インフルエンザ流行状況</title><link rel="stylesheet" href="css/style.css?v=3"><link rel="stylesheet" href="css/level-overrides.css?v=3"></head>
<body><div class="screen"><header class="header"><div class="prefecture">横浜市</div><h1 class="title">インフルエンザ流行状況</h1></header>
<main class="content"><section class="status status-unknown" aria-label="横浜市のインフルエンザ流行状況" aria-live="polite"><div id="level" class="level level-unknown"><span class="level-label">確認中</span></div><div class="value"><span id="value">--</span><span class="unit">人</span></div><div class="caption">定点当たり報告数</div><div id="trend" class="trend">先週比：確認中</div><div id="updated" class="updated">対象週：確認中</div><div class="data-state">出典：神奈川県衛生研究所（週別CSV）</div></section>
<section class="measures" aria-label="感染対策のイラスト：手洗い、体調報告、換気"><img class="measure-image measure-image-top" src="assets/handwash.png" alt="手洗い" onerror="this.classList.add('image-error');this.setAttribute('aria-label','手洗いの画像を読み込めません')"><img class="measure-image measure-image-left" src="assets/healthcheck.png" alt="体調報告" onerror="this.classList.add('image-error');this.setAttribute('aria-label','体調報告の画像を読み込めません')"><img class="measure-image measure-image-right" src="assets/ventilation.png" alt="換気" onerror="this.classList.add('image-error');this.setAttribute('aria-label','換気の画像を読み込めません')"></section></main>
<footer>体調に変化がある場合は、無理をせず報告してください</footer></div><noscript>JavaScriptが無効です。数値は確認中です。</noscript><script src="js/app.js?v=3" defer></script></body></html>
