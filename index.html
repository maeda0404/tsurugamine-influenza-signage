<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e5f1f8">
<title>横浜市 インフルエンザ流行状況</title>
<link rel="stylesheet" href="css/style.css?v=5">
<link rel="stylesheet" href="css/level-overrides.css?v=5">
<script src="js/app.js?v=5" defer></script>
</head>
<body>
<div class="screen">
<header class="header"><div class="prefecture">横浜市</div><h1 class="title">インフルエンザ流行状況</h1></header>
<main class="content">
<section class="status status-unknown" aria-label="横浜市のインフルエンザ流行状況" aria-live="polite">
  <div id="level" class="level level-unknown"><span class="level-label">確認中</span></div>
  <div class="value"><span id="value">--</span><span class="unit">人</span></div>
  <div class="caption">定点当たり報告数</div>
  <div id="trend" class="trend">先週比：確認中</div>
  <div id="updated" class="updated">対象週：確認中</div>
  <div class="data-state">出典：神奈川県衛生研究所（週別CSV）</div>
</section>
<section class="measures" aria-label="感染対策：手洗い、体調報告、換気、正しいマスク着用">
  <img class="measure-image" src="assets/handwash.png?v=5" alt="手洗い">
  <img class="measure-image" src="assets/healthcheck.png?v=5" alt="体調報告">
  <img class="measure-image" src="assets/ventilation.png?v=5" alt="換気">
  <img class="measure-image" src="assets/mask.png?v=5" alt="正しいマスク着用">
</section>
</main>
<footer>体調に変化がある場合は、無理をせず報告してください</footer>
</div>
<noscript><div class="noscript">JavaScriptが無効です。流行状況は公表元でご確認ください。</div></noscript>
</body></html>
