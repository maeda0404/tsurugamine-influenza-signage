<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>横浜市 感染症流行状況</title>
<link rel="stylesheet" href="css/style.css?v=8">
<link rel="stylesheet" href="css/level-overrides.css?v=8">
<link rel="stylesheet" href="css/infection-layout.css?v=8">
<script src="js/app.js?v=8" defer></script>
</head>
<body>
<div class="screen">
  <header class="header"><div id="area" class="prefecture">横浜市</div><h1 class="title">感染症流行状況</h1></header>
  <main class="infection-layout">
    <aside class="side-images left-images" aria-label="感染対策"><img src="assets/handwash.png?v=8" alt="手洗い"><img src="assets/ventilation.png?v=8" alt="換気"></aside>
    <section class="status infection-main" aria-live="polite">
      <div class="disease-grid">
        <article id="influenzaCard" class="disease-card influenza"><h2>インフルエンザ</h2><div id="influenzaLevel" class="level-badge">確認中</div><div class="reading"><strong id="influenzaValue">--</strong><span>人</span></div><div class="metric-label">定点当たり報告数</div><div id="influenzaTrend" class="trend">前週比較 --</div><div id="influenzaWeek" class="week">--</div></article>
        <article id="covid19Card" class="disease-card covid"><h2>新型コロナ</h2><div id="covid19Level" class="level-badge">確認中</div><div class="reading"><strong id="covid19Value">--</strong><span>人</span></div><div class="metric-label">定点当たり報告数</div><div id="covid19Trend" class="trend">前週比較 --</div><div id="covid19Week" class="week">--</div></article>
      </div>
      <div class="legend"><span class="legend-normal">非流行 &lt;1</span><span class="legend-flow">流行中 1以上</span><span class="legend-advisory">注意報 10以上</span><span class="legend-warning">警報 30以上</span></div>
      <div class="statusline"><span id="unit">定点当たり報告数</span>｜<span id="dataStatus">確認中</span></div>
      <div class="source">出典：神奈川県衛生研究所（週別CSV）</div>
    </section>
    <aside class="side-images right-images" aria-label="感染対策"><img src="assets/healthcheck.png?v=8" alt="体調報告"><img src="assets/mask.png?v=8" alt="正しいマスク着用"></aside>
  </main>
  <footer>体調に変化がある場合は、無理をせず報告してください</footer>
</div>
</body>
</html>
